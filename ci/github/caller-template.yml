# Copied into each project as .github/workflows/quality-gate.yml by `jangkar-test`.
name: quality-gate

on:
  schedule:
    - cron: "17 19 * * *" # nightly full mutation run
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: vinsonsid/jangkar-testing-engines/.github/workflows/quality-gate.yml@__ENGINE_VERSION__
    secrets: inherit
