# Reusable quality gate. Projects call it with a 10-line workflow:
#   jobs:
#     quality-gate:
#       uses: vinsonsid/jangkar-testing-engines/.github/workflows/quality-gate.yml@v0.2.0
#       secrets: inherit
#
# Note: GitHub requires reusable workflows to live under .github/workflows in
# the source repo, so this file is mirrored there. ci/github/ is the canonical
# copy that `jangkar-test` reads; keep both in sync (tests/ci.test.mjs checks).

name: quality-gate

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      run-mutation:
        description: Run Stryker on src/core. Auto-detected on PRs touching src/core when unset.
        type: boolean
        default: false
      supabase:
        description: Start a local Supabase before integration/system tests.
        type: boolean
        default: false
      working-directory:
        type: string
        default: "."

env:
  CI: "true"
  FORCE_COLOR: "1"

jobs:
  doctor:
    name: doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npx jangkar-test doctor

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: doctor
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: doctor
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit + coverage
    runs-on: ubuntu-latest
    needs: doctor
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = k => `| ${k} | ${s[k].pct}% |`;
              console.log("### Coverage (src/core + src/adapters)\n\n| Metric | % |\n|---|---|\n" + ["lines","branches","functions","statements"].map(row).join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage
          retention-days: 14

  integration:
    name: integration + system
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Detect Supabase
        id: sb
        run: echo "present=$([ -d supabase ] && echo true || echo ${{ inputs.supabase }})" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.sb.outputs.present == 'true'
        with:
          version: latest
      - name: Start Supabase
        if: steps.sb.outputs.present == 'true'
        run: supabase start
      - run: npm run test:integration
      - run: npm run test:system

  mutation:
    name: mutation (src/core)
    runs-on: ubuntu-latest
    needs: [unit]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Should run?
        id: gate
        run: |
          if [ "${{ inputs.run-mutation }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base"...HEAD | grep -q '^src/core/'; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: ${{ inputs.working-directory }}/reports/stryker-incremental.json
          key: stryker-${{ github.ref }}-${{ github.sha }}
          restore-keys: stryker-${{ github.ref }}-
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - run: npm run test:mutation
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: mutation-report
          path: ${{ inputs.working-directory }}/reports/mutation
          retention-days: 14

  quality-gate:
    # Single required status check for branch protection.
    name: quality-gate
    runs-on: ubuntu-latest
    needs: [doctor, lint, typecheck, unit, integration, mutation]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"' && exit 1 || echo "all gates passed"
